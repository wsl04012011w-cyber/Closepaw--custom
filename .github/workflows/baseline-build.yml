name: Baseline Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout customization workspace
        uses: actions/checkout@v4

      - name: Checkout upstream ClosePaw
        uses: actions/checkout@v4
        with:
          repository: imoonkey/closepaw
          ref: main
          path: upstream
          persist-credentials: false

      - name: Apply custom ChatGPT Free Codex model mapping
        run: python scripts/patch_upstream_models.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: upstream
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: closepaw-baseline-debug
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
